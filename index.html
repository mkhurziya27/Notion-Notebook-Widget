<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Check-In Notebook</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Quicksand:wght@700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Floating Date Header Above Notebook */
    .header-date {
      width: 320px;
      font-size: 1rem;
      font-weight: 700;
      color: #6c8ca7;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    /* Main Container using your exact Canva PNG */
    .notebook-card {
      position: relative;
      width: 440px;
      height: 440px;
      background: url('https://github.com/mkhurziya27/Notion-Notebook-Widget/blob/main/notebook-bg.png?raw=true') no-repeat center center;
      background-size: contain;
    }

    /* Invisible Click Zones over the arrows in your Canva art */
    .arrow-click-left, .arrow-click-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      cursor: pointer;
      border-radius: 50%;
      z-index: 20;
    }
    .arrow-click-left { left: 65px; }
    .arrow-click-right { right: 65px; }

    /* Typing Area centered directly over paper lines */
    textarea {
      position: absolute;
      top: 130px;
      left: 135px;
      width: 180px;
      height: 200px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      color: #2c3e50;
      line-height: 24px;
      z-index: 10;
    }

    /* Save Controls below the graphic */
    .bottom-bar {
      width: 320px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 5px;
    }

    .save-btn {
      background-color: #8bbabb;
      color: white;
      border: none;
      padding: 6px 18px;
      border-radius: 16px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(139, 186, 187, 0.3);
      transition: all 0.2s ease;
    }

    .save-btn:hover { background-color: #72a4a5; }

    .status-msg {
      font-size: 0.8rem;
      font-weight: 600;
      color: #6a9955;
    }
  </style>
</head>
<body>

  <div class="header-date">
    <span id="display-date">--</span>
    <span id="display-dow" style="font-size: 0.85rem; color: #a0b2c6;">--</span>
  </div>

  <div class="notebook-card">
    <div class="arrow-click-left" onclick="changeDay(-1)" title="Previous Day"></div>
    <div class="arrow-click-right" onclick="changeDay(1)" title="Next Day"></div>

    <textarea id="checkin-text" placeholder="Click here to start typing..."></textarea>
  </div>

  <div class="bottom-bar">
    <span id="status" class="status-msg"></span>
    <button id="save-btn" class="save-btn" onclick="saveToNotion()">Save Page</button>
  </div>

  <script>
    const NOTION_API_KEY = "ntn_W72115767057TwQkQ8w7mWgoKqtffH1h4lgsFNAXhXzegf";
    const DATABASE_ID = "37b1add7ed8180c7845dc93ed1d310d0";

    let currentDate = new Date();

    function updateHeader() {
      const dayNum = currentDate.getDate();
      const monthName = currentDate.toLocaleString('default', { month: 'long' });
      const dayOfWeek = currentDate.toLocaleString('default', { weekday: 'long' });

      document.getElementById('display-date').innerText = `${dayNum} ${monthName}`;
      document.getElementById('display-dow').innerText = dayOfWeek;
      document.getElementById('checkin-text').value = '';
      document.getElementById('status').innerText = '';
    }

    function changeDay(offset) {
      currentDate.setDate(currentDate.getDate() + offset);
      updateHeader();
    }

    async function saveToNotion() {
      const text = document.getElementById('checkin-text').value.trim();
      const status = document.getElementById('status');
      const saveBtn = document.getElementById('save-btn');

      if (!text) {
        status.style.color = '#e74c3c';
        status.innerText = "Page is empty!";
        return;
      }

      saveBtn.disabled = true;
      status.style.color = '#3498db';
      status.innerText = "Saving...";

      const dayNum = currentDate.getDate();
      const monthName = currentDate.toLocaleString('default', { month: 'long' });
      const dayOfWeek = currentDate.toLocaleString('default', { weekday: 'long' });

      const payload = {
        parent: { database_id: DATABASE_ID },
        properties: {
          "Day": { title: [{ text: { content: `${dayNum} ${monthName}` } }] },
          "DOW": { select: { name: dayOfWeek } },
          "Daily Check In": { rich_text: [{ text: { content: text } }] }
        }
      };

      try {
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://api.notion.com/v1/pages'), {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${NOTION_API_KEY}`,
            'Notion-Version': '2022-06-28',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          status.style.color = '#2ecc71';
          status.innerText = "Saved! ✨";
        } else {
          throw new Error('Save error');
        }
      } catch (err) {
        status.style.color = '#e74c3c';
        status.innerText = "Failed to save!";
      } finally {
        saveBtn.disabled = false;
      }
    }

    updateHeader();
  </script>
</body>
</html>
