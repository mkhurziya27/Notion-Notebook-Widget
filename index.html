<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Notebook Journal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      font-family: 'Quicksand', sans-serif;
    }

    .wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 500px;
    }

    .nav-btn {
      background: #e2ebf0;
      color: #78909c;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      transition: all 0.2s ease;
      user-select: none;
    }

    .nav-btn:hover {
      background: #cfd8dc;
      color: #37474f;
      transform: scale(1.05);
    }

    .notebook-container {
      position: relative;
      flex: 1;
      height: 540px;
      background: #fffdf9;
      border: 3px solid #cbdbe6;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 25px 25px 20px 50px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .spirals {
      position: absolute;
      left: 12px;
      top: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
    }

    .spiral-ring {
      width: 22px;
      height: 12px;
      background: linear-gradient(135deg, #e0e0e0 0%, #b5b5b5 100%);
      border-radius: 6px;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.15);
      border: 1px solid #9e9e9e;
    }

    .header-date {
      font-size: 1.1rem;
      font-weight: 700;
      color: #6c8ca7;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .lined-paper {
      flex: 1;
      width: 100%;
      background: repeating-linear-gradient(
        transparent,
        transparent 27px,
        #e3e8ee 28px
      );
      line-height: 28px;
    }

    /* Direct Typing Area */
    textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Caveat', cursive;
      font-size: 1.55rem;
      color: #2c3e50;
      line-height: 28px;
      padding-top: 2px;
    }

    .star { position: absolute; pointer-events: none; user-select: none; }
    .star-1 { top: 15px; right: 20px; font-size: 22px; color: #fff3a7; }
    .star-2 { bottom: 20px; left: 45px; font-size: 30px; color: #b2d8f7; }
    .star-3 { bottom: 15px; right: 25px; font-size: 24px; color: #fff3a7; }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 5px;
      z-index: 10;
    }

    .save-btn {
      background-color: #8bbabb;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 16px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(139, 186, 187, 0.3);
      transition: all 0.2s ease;
    }

    .save-btn:hover { background-color: #72a4a5; }

    .status-msg {
      font-size: 0.8rem;
      font-weight: 600;
      color: #6a9955;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <button class="nav-btn" onclick="changeDay(-1)">❮</button>

    <div class="notebook-container">
      <div class="spirals">
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
      </div>

      <div class="star star-1">⭐</div>
      <div class="star star-2">⭐</div>
      <div class="star star-3">⭐</div>

      <div class="header-date">
        <span id="display-date">--</span>
        <span id="display-dow" style="font-size: 0.85rem; color: #a0b2c6;">--</span>
      </div>

      <div class="lined-paper">
        <textarea id="checkin-text" placeholder="Click here to start writing..."></textarea>
      </div>

      <div class="bottom-bar">
        <span id="status" class="status-msg"></span>
        <button id="save-btn" class="save-btn" onclick="saveToNotion()">Save Page</button>
      </div>
    </div>

    <button class="nav-btn" onclick="changeDay(1)">❯</button>
  </div>

  <script>
    const NOTION_API_KEY = "ntn_W72115767057TwQkQ8w7mWgoKqtffH1h4lgsFNAXhXzegf";
    const DATABASE_ID = "37b1add7ed8180c7845dc93ed1d310d0";

    let currentDate = new Date();

    function updateHeader() {
      const dayNum = currentDate.getDate();
      const monthName = currentDate.toLocaleString('default', { month: 'long' });
      const dayOfWeek = currentDate.toLocaleString('default', { weekday: 'long' });

      document.getElementById('display-date').innerText = `${dayNum} ${monthName}`;
      document.getElementById('display-dow').innerText = dayOfWeek;
      document.getElementById('checkin-text').value = '';
      document.getElementById('status').innerText = '';
    }

    function changeDay(offset) {
      currentDate.setDate(currentDate.getDate() + offset);
      updateHeader();
    }

    async function saveToNotion() {
      const text = document.getElementById('checkin-text').value.trim();
      const status = document.getElementById('status');
      const saveBtn = document.getElementById('save-btn');

      if (!text) {
        status.style.color = '#e74c3c';
        status.innerText = "Page is empty!";
        return;
      }

      saveBtn.disabled = true;
      status.style.color = '#3498db';
      status.innerText = "Saving...";

      const dayNum = currentDate.getDate();
      const monthName = currentDate.toLocaleString('default', { month: 'long' });
      const dayOfWeek = currentDate.toLocaleString('default', { weekday: 'long' });

      const payload = {
        parent: { database_id: DATABASE_ID },
        properties: {
          "Day": { title: [{ text: { content: `${dayNum} ${monthName}` } }] },
          "DOW": { select: { name: dayOfWeek } },
          "Daily Check In": { rich_text: [{ text: { content: text } }] }
        }
      };

      try {
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://api.notion.com/v1/pages'), {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${NOTION_API_KEY}`,
            'Notion-Version': '2022-06-28',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          status.style.color = '#2ecc71';
          status.innerText = "Saved! ✨";
        } else {
          throw new Error('Save error');
        }
      } catch (err) {
        status.style.color = '#e74c3c';
        status.innerText = "Failed to save!";
      } finally {
        saveBtn.disabled = false;
      }
    }

    updateHeader();
  </script>
</body>
</html>
