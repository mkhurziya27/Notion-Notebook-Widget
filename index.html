<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Check-In Notebook</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Quicksand:wght@700&display=swap');

    :root {
      --book-width: min(72vw, 500px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-direction: column;
      padding: 14px 8px 20px;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .widget {
      width: min(100%, 720px);
    }

    .header-date {
      width: var(--book-width);
      margin: 0 auto 4px;
      padding: 0 3%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: #6c8ca7;
      font-size: clamp(0.9rem, 2.6vw, 1.08rem);
      font-weight: 700;
      user-select: none;
    }

    #display-dow {
      color: #a0b2c6;
      font-size: 0.88em;
    }

    .stage {
      display: grid;
      grid-template-columns: 48px var(--book-width) 48px;
      justify-content: center;
      align-items: center;
      column-gap: 12px;
    }

    .notebook-card {
      position: relative;
      width: var(--book-width);
      aspect-ratio: 1170 / 1545;
    }

    .notebook-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    textarea {
      position: absolute;
      z-index: 2;
      top: 23.5%;
      left: 15.5%;
      width: 76.5%;
      height: 53.5%;
      padding: 0 2px;
      overflow-y: auto;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #2c3e50;
      caret-color: #6c8ca7;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(12px, calc(var(--book-width) * 0.03), 15px);
      font-weight: 500;
      line-height: calc(var(--book-width) * 0.049);
    }

    textarea:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    textarea::placeholder {
      color: rgba(74, 82, 89, 0.48);
    }

    .nav-btn {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #dbe7ef;
      color: #91a9bb;
      font-family: Arial, sans-serif;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 7px 14px rgba(96, 121, 140, 0.12);
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        opacity 0.15s ease;
    }

    .nav-btn:hover {
      background: #cfdee9;
      transform: translateY(-1px);
    }

    .nav-btn:active {
      transform: translateY(1px);
    }

    .nav-btn:disabled {
      cursor: wait;
      opacity: 0.55;
      transform: none;
    }

    .bottom-bar {
      width: var(--book-width);
      min-height: 42px;
      margin: 5px auto 0;
      padding: 0 2%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .save-btn {
      flex: 0 0 auto;
      border: 0;
      border-radius: 18px;
      padding: 8px 20px;
      background: #8bbabb;
      color: #fff;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(139, 186, 187, 0.28);
      transition:
        background 0.18s ease,
        transform 0.18s ease,
        opacity 0.18s ease;
    }

    .save-btn:hover {
      background: #72a4a5;
      transform: translateY(-1px);
    }

    .save-btn:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    .status-msg {
      min-width: 0;
      color: #6a9955;
      font-size: 0.8rem;
      font-weight: 600;
    }

    @media (max-width: 580px) {
      :root {
        --book-width: min(74vw, 390px);
      }

      .stage {
        grid-template-columns: 38px var(--book-width) 38px;
        column-gap: 5px;
      }

      .nav-btn {
        width: 36px;
        height: 36px;
        font-size: 1.6rem;
      }

      .bottom-bar {
        padding-left: 0;
        padding-right: 0;
      }
    }
  </style>
</head>

<body>
  <main class="widget">
    <div class="header-date">
      <span id="display-date">--</span>
      <span id="display-dow">--</span>
    </div>

    <div class="stage">
      <button
        id="previous-btn"
        class="nav-btn"
        type="button"
        aria-label="Previous day"
      >
        ‹
      </button>

      <div class="notebook-card">
        <img
          class="notebook-art"
          src="./notebook-bg-cropped.png"
          alt=""
        />

        <textarea
          id="checkin-text"
          aria-label="Daily check-in"
          placeholder="Click here to start typing..."
        ></textarea>
      </div>

      <button
        id="next-btn"
        class="nav-btn"
        type="button"
        aria-label="Next day"
      >
        ›
      </button>
    </div>

    <div class="bottom-bar">
      <span
        id="status"
        class="status-msg"
        aria-live="polite"
      ></span>

      <button
        id="save-btn"
        class="save-btn"
        type="button"
      >
        Save Page
      </button>
    </div>
  </main>

  <script>
    const API_ENDPOINT = '/api/notion';

    let currentDate = new Date();
    let isLoading = false;
    let lastLoadedText = '';

    const textArea = document.getElementById('checkin-text');
    const status = document.getElementById('status');
    const saveBtn = document.getElementById('save-btn');
    const previousBtn = document.getElementById('previous-btn');
    const nextBtn = document.getElementById('next-btn');
    const displayDate = document.getElementById('display-date');
    const displayDow = document.getElementById('display-dow');

    function localDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');

      return `${year}-${month}-${day}`;
    }

    function draftStorageKey(date) {
      return `daily-checkin-draft:${localDateKey(date)}`;
    }

    function updateDateHeading() {
      displayDate.textContent = currentDate.toLocaleDateString('en-GB', {
        day: 'numeric',
        month: 'long'
      });

      displayDow.textContent = currentDate.toLocaleDateString('en-GB', {
        weekday: 'long'
      });
    }

    function setStatus(message, type = 'neutral') {
      status.textContent = message;

      if (type === 'success') {
        status.style.color = '#6a9955';
      } else if (type === 'error') {
        status.style.color = '#d65f5f';
      } else {
        status.style.color = '#6c8ca7';
      }
    }

    function setBusy(busy) {
      isLoading = busy;
      textArea.disabled = busy;
      saveBtn.disabled = busy;
      previousBtn.disabled = busy;
      nextBtn.disabled = busy;
    }

    function saveDraftLocally() {
      const key = draftStorageKey(currentDate);
      const value = textArea.value;

      if (value === lastLoadedText) {
        localStorage.removeItem(key);
      } else {
        localStorage.setItem(key, value);
      }
    }

    function restoreDraftIfPresent(notionText) {
      const savedDraft = localStorage.getItem(
        draftStorageKey(currentDate)
      );

      if (
        savedDraft !== null &&
        savedDraft !== notionText
      ) {
        textArea.value = savedDraft;
        setStatus('Unsaved draft restored', 'neutral');
      } else {
        textArea.value = notionText;
        setStatus('');
      }
    }

    async function loadPage() {
      updateDateHeading();
      setBusy(true);
      setStatus('Loading…', 'neutral');

      textArea.value = '';
      lastLoadedText = '';

      try {
        const date = localDateKey(currentDate);

        const response = await fetch(
          `${API_ENDPOINT}?date=${encodeURIComponent(date)}`,
          {
            method: 'GET',
            headers: {
              Accept: 'application/json'
            }
          }
        );

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            result.error || 'Could not load this date.'
          );
        }

        lastLoadedText = result.text || '';
        restoreDraftIfPresent(lastLoadedText);
      } catch (error) {
        console.error(error);

        const savedDraft = localStorage.getItem(
          draftStorageKey(currentDate)
        );

        textArea.value = savedDraft || '';

        if (
          error.message.includes('No habit-tracker row')
        ) {
          setStatus('No tracker row exists for this date', 'error');
        } else {
          setStatus(error.message || 'Could not load from Notion', 'error');
        }
      } finally {
        setBusy(false);
      }
    }

    async function changeDay(offset) {
      if (isLoading) {
        return;
      }

      saveDraftLocally();

      const nextDate = new Date(currentDate);
      nextDate.setDate(nextDate.getDate() + offset);
      currentDate = nextDate;

      await loadPage();
    }

    async function savePage() {
      if (isLoading) {
        return;
      }

      saveDraftLocally();
      setBusy(true);
      setStatus('Saving…', 'neutral');

      try {
        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Accept: 'application/json'
          },
          body: JSON.stringify({
            date: localDateKey(currentDate),
            text: textArea.value
          })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            result.error || 'Could not save to Notion.'
          );
        }

        lastLoadedText = textArea.value;

        localStorage.removeItem(
          draftStorageKey(currentDate)
        );

        setStatus('Saved to Notion ✨', 'success');
      } catch (error) {
        console.error(error);

        saveDraftLocally();

        if (
          error.message.includes('No habit-tracker row')
        ) {
          setStatus('No tracker row exists for this date', 'error');
        } else {
          setStatus(error.message || 'Could not save to Notion', 'error');
        }
      } finally {
        setBusy(false);
      }
    }

    previousBtn.addEventListener('click', () => {
      changeDay(-1);
    });

    nextBtn.addEventListener('click', () => {
      changeDay(1);
    });

    saveBtn.addEventListener('click', savePage);

    textArea.addEventListener('input', () => {
      saveDraftLocally();

      if (textArea.value !== lastLoadedText) {
        setStatus('Unsaved changes', 'neutral');
      } else {
        setStatus('');
      }
    });

    window.addEventListener('beforeunload', saveDraftLocally);

    loadPage();
  </script>
</body>
</html>
