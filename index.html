<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Check-In Notebook</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Quicksand:wght@700&display=swap');

    :root {
      /* Increase 500px if you want a larger notebook. */
      --book-width: min(72vw, 500px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-direction: column;
      padding: 14px 8px 20px;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .widget {
      width: min(100%, 720px);
    }

    .header-date {
      width: var(--book-width);
      margin: 0 auto 4px;
      padding: 0 3%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: #6c8ca7;
      font-size: clamp(0.9rem, 2.6vw, 1.08rem);
      font-weight: 700;
      user-select: none;
    }

    #display-dow {
      color: #a0b2c6;
      font-size: 0.88em;
    }

    .stage {
      display: grid;
      grid-template-columns: 48px var(--book-width) 48px;
      justify-content: center;
      align-items: center;
      column-gap: 12px;
    }

    .notebook-card {
      position: relative;
      width: var(--book-width);
      aspect-ratio: 1170 / 1545;
    }

    .notebook-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    textarea {
      position: absolute;
      z-index: 2;

      /* These percentages follow the actual page inside the cropped PNG. */
      top: 23.5%;
      left: 15.5%;
      width: 76.5%;
      height: 53.5%;

      padding: 0 2px;
      overflow-y: auto;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;

      color: #2c3e50;
      caret-color: #6c8ca7;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(12px, calc(var(--book-width) * 0.03), 15px);
      font-weight: 500;
      line-height: calc(var(--book-width) * 0.049);
    }

    textarea::placeholder {
      color: rgba(74, 82, 89, 0.48);
    }

    .nav-btn {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #dbe7ef;
      color: #91a9bb;
      font-family: Arial, sans-serif;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 7px 14px rgba(96, 121, 140, 0.12);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .nav-btn:hover {
      background: #cfdee9;
      transform: translateY(-1px);
    }

    .nav-btn:active {
      transform: translateY(1px);
    }

    .bottom-bar {
      width: var(--book-width);
      min-height: 42px;
      margin: 5px auto 0;
      padding: 0 2%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .save-btn {
      flex: 0 0 auto;
      border: 0;
      border-radius: 18px;
      padding: 8px 20px;
      background: #8bbabb;
      color: #fff;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(139, 186, 187, 0.28);
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .save-btn:hover {
      background: #72a4a5;
      transform: translateY(-1px);
    }

    .save-btn:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .status-msg {
      min-width: 0;
      color: #6a9955;
      font-size: 0.8rem;
      font-weight: 600;
    }

    @media (max-width: 580px) {
      :root {
        --book-width: min(74vw, 390px);
      }

      .stage {
        grid-template-columns: 38px var(--book-width) 38px;
        column-gap: 5px;
      }

      .nav-btn {
        width: 36px;
        height: 36px;
        font-size: 1.6rem;
      }

      .bottom-bar {
        padding-left: 0;
        padding-right: 0;
      }
    }
  </style>
</head>

<body>
  <main class="widget">
    <div class="header-date">
      <span id="display-date">--</span>
      <span id="display-dow">--</span>
    </div>

    <div class="stage">
      <button class="nav-btn" type="button" onclick="changeDay(-1)" aria-label="Previous day">‹</button>

      <div class="notebook-card">
        <img
        class="notebook-art"
        src="https://mkhurziya27.github.io/Notion-Notebook-Widget/notebook-bg-cropped.png?v=11"
        alt=""
        />
        <textarea
          id="checkin-text"
          aria-label="Daily check-in"
          placeholder="Click here to start typing..."
        ></textarea>
      </div>

      <button class="nav-btn" type="button" onclick="changeDay(1)" aria-label="Next day">›</button>
    </div>

    <div class="bottom-bar">
      <span id="status" class="status-msg" aria-live="polite"></span>
      <button id="save-btn" class="save-btn" type="button" onclick="savePage()">Save Page</button>
    </div>
  </main>

  <script>
    /*
      Leave this blank while testing the layout. The page will save drafts
      inside this browser. Later, place your secure serverless endpoint here.

      Example:
      const SAVE_ENDPOINT = 'https://your-project.vercel.app/api/save';
    */
    const SAVE_ENDPOINT = '';

    let currentDate = new Date();

    const textArea = document.getElementById('checkin-text');
    const status = document.getElementById('status');
    const saveBtn = document.getElementById('save-btn');

    function localDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function storageKey(date) {
      return `daily-checkin:${localDateKey(date)}`;
    }

    function persistDraft() {
      localStorage.setItem(storageKey(currentDate), textArea.value);
    }

    function updateView() {
      document.getElementById('display-date').textContent = currentDate.toLocaleDateString(undefined, {
        day: 'numeric',
        month: 'long'
      });

      document.getElementById('display-dow').textContent = currentDate.toLocaleDateString(undefined, {
        weekday: 'long'
      });

      textArea.value = localStorage.getItem(storageKey(currentDate)) || '';
      status.textContent = '';
    }

    function changeDay(offset) {
      persistDraft();
      currentDate.setDate(currentDate.getDate() + offset);
      updateView();
    }

    textArea.addEventListener('input', persistDraft);

    async function savePage() {
      const text = textArea.value.trim();

      if (!text) {
        status.style.color = '#d65f5f';
        status.textContent = 'Page is empty!';
        return;
      }

      persistDraft();

      /* Layout/testing mode: safely save in this browser. */
      if (!SAVE_ENDPOINT) {
        status.style.color = '#6a9955';
        status.textContent = 'Saved in this browser ✨';
        return;
      }

      saveBtn.disabled = true;
      status.style.color = '#6c8ca7';
      status.textContent = 'Saving…';

      const payload = {
        date: localDateKey(currentDate),
        title: currentDate.toLocaleDateString(undefined, {
          day: 'numeric',
          month: 'long'
        }),
        dayOfWeek: currentDate.toLocaleDateString(undefined, {
          weekday: 'long'
        }),
        text
      };

      try {
        const response = await fetch(SAVE_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.error || 'Save failed');
        }

        status.style.color = '#6a9955';
        status.textContent = 'Saved to Notion ✨';
      } catch (error) {
        console.error(error);
        status.style.color = '#d65f5f';
        status.textContent = 'Could not save to Notion';
      } finally {
        saveBtn.disabled = false;
      }
    }

    updateView();
  </script>
</body>
</html>
