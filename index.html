<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notebook Daily Check-In</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Quicksand:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 520px;
    }

    .nav-btn {
      background: #e2ebf0;
      color: #78909c;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition: all 0.2s ease;
      user-select: none;
      flex-shrink: 0;
    }

    .nav-btn:hover {
      background: #cfd8dc;
      color: #37474f;
      transform: scale(1.08);
    }

    .notebook-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 380px;
    }

    .header-date {
      width: 100%;
      font-size: 1.05rem;
      font-weight: 700;
      color: #6c8ca7;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      user-select: none;
    }

    .notebook-container {
      position: relative;
      width: 360px;
      height: 480px;
      background: url('https://github.com/mkhurziya27/Notion-Notebook-Widget/blob/main/notebook-bg.png?raw=true') no-repeat center center;
      background-size: 100% 100%;
      /* Pushes typing area safely below the "daily check in" banner */
      padding: 145px 35px 45px 55px;
      display: flex;
      flex-direction: column;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: #2c3e50;
      line-height: 24px;
    }

    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding: 0 5px;
    }

    .save-btn {
      background-color: #8bbabb;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(139, 186, 187, 0.35);
      transition: all 0.2s ease;
    }

    .save-btn:hover { background-color: #72a4a5; }

    .status-msg {
      font-size: 0.8rem;
      font-weight: 600;
      color: #6a9955;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <button class="nav-btn" onclick="changeDay(-1)">❮</button>

    <div class="notebook-card">
      <div class="header-date">
        <span id="display-date">--</span>
        <span id="display-dow" style="font-size: 0.85rem; color: #a0b2c6;">--</span>
      </div>

      <div class="notebook-container">
        <textarea id="checkin-text" placeholder="Click here to start typing..."></textarea>
      </div>

      <div class="bottom-bar">
        <span id="status" class="status-msg"></span>
        <button id="save-btn" class="save-btn" onclick="saveToNotion()">Save Page</button>
      </div>
    </div>

    <button class="nav-btn" onclick="changeDay(1)">❯</button>
  </div>

  <script>
    const NOTION_API_KEY = "ntn_W72115767057TwQkQ8w7mWgoKqtffH1h4lgsFNAXhXzegf";
    const DATABASE_ID = "37b1add7ed8180c7845dc93ed1d310d0";

    let currentDate = new Date();

    function updateHeader() {
      const dayNum = currentDate.getDate();
      const monthName = currentDate.toLocaleString('default', { month: 'long' });
      const dayOfWeek = currentDate.toLocaleString('default', { weekday: 'long' });

      document.getElementById('display-date').innerText = `${dayNum} ${monthName}`;
      document.getElementById('display-dow').innerText = dayOfWeek;
      document.getElementById('checkin-text').value = '';
      document.getElementById('status').innerText = '';
    }

    function changeDay(offset) {
      currentDate.setDate(currentDate.getDate() + offset);
      updateHeader();
    }

    async function saveToNotion() {
      const text = document.getElementById('checkin-text').value.trim();
      const status = document.getElementById('status');
      const saveBtn = document.getElementById('save-btn');

      if (!text) {
        status.style.color = '#e74c3c';
        status.innerText = "Page is empty!";
        return;
      }

      saveBtn.disabled = true;
      status.style.color = '#3498db';
      status.innerText = "Saving...";

      const dayNum = currentDate.getDate();
      const monthName = currentDate.toLocaleString('default', { month: 'long' });
      const dayOfWeek = currentDate.toLocaleString('default', { weekday: 'long' });

      const payload = {
        parent: { database_id: DATABASE_ID },
        properties: {
          "Day": { title: [{ text: { content: `${dayNum} ${monthName}` } }] },
          "DOW": { select: { name: dayOfWeek } },
          "Daily Check In": { rich_text: [{ text: { content: text } }] }
        }
      };

      try {
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://api.notion.com/v1/pages'), {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${NOTION_API_KEY}`,
            'Notion-Version': '2022-06-28',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          status.style.color = '#2ecc71';
          status.innerText = "Saved! ✨";
        } else {
          throw new Error('Save error');
        }
      } catch (err) {
        status.style.color = '#e74c3c';
        status.innerText = "Failed to save!";
      } finally {
        saveBtn.disabled = false;
      }
    }

    updateHeader();
  </script>
</body>
</html>
